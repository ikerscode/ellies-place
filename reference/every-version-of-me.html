  W:(x,y)=>{ R('rgba(10,6,16,.3)',x+3,y+14,10,2); R(OUT,x+3,y+6,10,10); R('#3a3848',x+4,y+7,8,8); R(OUT,x+4,y+2,8,5); R('#3a3848',x+5,y+3,6,1); R('#3a3848',x+5,y+3,1,4); R('#3a3848',x+10,y+3,1,4); R('#6b6878',x+5,y+8,2,2); R('#e9c46a',x+6,y+11,4,1); },
  K:(x,y,tx)=>{ R('#b0304f',x,y+3,16,11); for(let i=0;i<4;i++)for(let j=0;j<3;j++) if((i+j)%2) R('#efe4d0',x+i*4,y+3+j*4,4,3);
    if(tx===13){ R(OUT,x+9,y+4,5,6); R('#8e6cc2',x+10,y+5,3,4); R('#6b4a3a',x+10,y+5,3,1); if(Math.sin(time*3)>0) R('rgba(255,255,255,.6)',x+11,y+1+Math.floor(time*4)%3,1,2);
      R('#d9a86a',x+2,y+6,6,2); R('#c49070',x+2,y+8,6,1); } }
});
const _drawWall2=drawWall;
drawWall=function(x,y,tx,ty){ _drawWall2(x,y,tx,ty);
  if(ty===0&&room.index===10&&tx===7){ R('#6b4a3a',x+1,y+1,14,11); R('#2a2a30',x+2,y+2,12,9); R('#efe6f5',x+3,y+3,7,1); R('#efe6f5',x+3,y+5,9,1); R('#efe6f5',x+3,y+7,6,1); R('#7fe0a0',x+11,y+7,2,2); R('#fbf5ee',x+11,y+9,2,1); } };

/* extra instruments for the heavy record-shop remix and the letters */
let DIST=null;
function distCurve(){ if(DIST) return DIST; const n=1024, c=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/n*2-1; c[i]=Math.tanh(x*6); } return DIST=c; }
function vChug(m,t,dur,vol,dest){ const ws=AC.createWaveShaper(); ws.curve=distCurve(); const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1500;
  const g=AC.createGain(); env(g,t,.003,vol,dur); ws.connect(f); f.connect(g); g.connect(dest); [0,7].forEach(iv=>osc('sawtooth',mf(m+iv),t,dur,ws)); }
function vLead(m,t,dur,vol,dest){ const ws=AC.createWaveShaper(); ws.curve=distCurve(); const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2400;
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.setValueAtTime(vol,t+Math.max(.03,dur-.05)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.15);
  ws.connect(f); f.connect(g); g.connect(dest); const o=osc('square',mf(m),t,dur+.2,ws); const v=AC.createOscillator(); v.frequency.value=5.5; const vg=AC.createGain(); vg.gain.value=mf(m)*.008; v.connect(vg); vg.connect(o.frequency); v.start(t+.1); v.stop(t+dur+.2); }
function vSnare(t,vol,dest){ noiseHit(t,vol,'bandpass',1900,.13,.7,dest); const g=AC.createGain(); env(g,t,.002,vol*.8,.08); g.connect(dest); osc('triangle',190,t,.1,g); }
function restoreMusic(){ setMusicStyle(G&&G.musicOverride?G.musicOverride:(room?room.index:0)); }

/* settings */
function txtSpeed(){ return {normal:40,fast:95,instant:1e6}[STORE.settings.textSpeed]||40; }
function applySettings(){ const S=STORE.settings; document.body.classList.toggle('bigtext',S.textSize==='large');
  MUSIC_VOL=0.6*S.music; AMB_VOL=0.55*S.music;
  if(AC){ const now=AC.currentTime; if(musicOn){ musicBus.gain.cancelScheduledValues(now); musicBus.gain.setTargetAtTime(Math.max(MUSIC_VOL,0.0001),now,.1); }
    ambBus.gain.setTargetAtTime(musicOn?AMB_VOL:0,now,.1); sfxBus.gain.setTargetAtTime(S.sfx,now,.1); miniBus.gain.setTargetAtTime(.75*S.music,now,.1); } }

/* stickers */
function earnSticker(id){ if(STORE.stickers.includes(id)) return; const s=CONFIG.stickers.find(x=>x.id===id); if(!s) return;
  STORE.stickers.push(id); saveStore(); setTimeout(()=>{ sfx('heart'); toast('Sticker: '+fmt(s.name)+'!',3200); },900); }

/* looking at things */
function inspectAt(x,y){ const k=room.index+':'+x+','+y, t=tileAt(x,y);
  if(room.index===0&&t==='V') return jukebox();
  const txt=CONFIG.inspect[k]||CONFIG.inspectTile[room.index+':'+t]; if(!txt) return false;
  say([{who:null,text:fmt(txt)}],()=>{ if(k==='0:12,7') earnSticker('hyrox'); if(k==='3:1,1') earnSticker('snacker'); });
  return true; }
function jukebox(){ const J=CONFIG.jukebox; G.juke=((G.juke===undefined?-1:G.juke)+1)%J.length; const [style,name]=J[G.juke];
  G.musicOverride=style; setMusicStyle(style); sfx('next'); burst(5*TS+8,1*TS+4,'spark',6); toast('Now playing: '+name,2600); earnSticker('dj'); return true; }

/* wishes on shooting stars */
function makeWish(){ const s=particles.find(p=>p.type==='shoot'); if(!s) return false; s.life=s.max;
  STORE.wishes++; saveStore(); burst(s.x,s.y,'spark',10); sfx('chime'); toast(fmt(CONFIG.wishes[(STORE.wishes-1)%CONFIG.wishes.length]),3600);
  if(STORE.wishes>=3) earnSticker('wish'); return true; }

/* Bruce, hiding in five rooms */
function bruceSpot(n){ G.bruceSeen=G.bruceSeen||[]; const k=room.index;
  if(!G.bruceSeen.includes(k)){ G.bruceSeen.push(k); addUnique(STORE.bruceSeen,k); G.flags.metBruce=true; STORE.bruce=true; saveRun();
    const c=G.bruceSeen.length; setTimeout(()=>{ sfx('heart'); toast(c>=5?'You found every Bruce!':'Bruce sighting '+c+' / 5'); if(c>=5) earnSticker('bruce'); },300);
    return say([{who:'bruce',text:CONFIG.bruceSpots[k]}]); }
  petCat(n); }
const bruceNPC=(x,y)=>({id:'bruce',x,y,talk(){ bruceSpot(this); }});

/* cats notice her outfit (once per cat per item) */
function outfitReact(n){ const O=STORE.outfit||{}, R_=CONFIG.outfitReacts[n.id]; if(!R_) return null;
  for(const slot of ['head','clip','neck']){ const it=O[slot]; if(it&&R_[it]&&!G.flags['rx_'+n.id+it]){ G.flags['rx_'+n.id+it]=true; return R_[it]; } } return null; }
function introLines(id){ const again=G.replay&&D[id+'Again']; return again?again.concat(D[id+'1'].slice(1)):D[id+'1']; }

/* part title cards */
function showPart(i){ const t=CONFIG.parts[i]; if(!t) return; const el=$('partCard'); el.textContent=t; el.classList.add('show'); clearTimeout(showPart.t); showPart.t=setTimeout(()=>el.classList.remove('show'),2800); }

/* ---------- ending ---------- */
function finale(){
  G.flags.letterRead=true; G.mode='ending'; sfx('lanterns');
  let n=0; const iv=setInterval(()=>{ particles.push({x:10+Math.random()*220,y:150+Math.random()*10,vx:0,vy:-(10+Math.random()*10),life:0,max:14,type:'lantern',seed:Math.random()*9}); if(++n>40) clearInterval(iv); },130);
  const cat=id=>room.npcs.find(c=>c.id===id), F=CONFIG.bubbles.finale;
  setTimeout(()=>{ bubble(cat('george'),F.george,3400); bubble(cat('peaches'),F.peaches,3400); },900);
  setTimeout(()=>{ bubble(cat('salem'),F.salem,3400); bubble(cat('shadow'),F.shadow,3400); },4600);
  if(G.flags.metBruce) setTimeout(()=>bubble(cat('bruce'),F.bruce,2600),8200);
  setTimeout(()=>{ if(room.sky==='moon') makePhoto(); },5200);
  setTimeout(showEnd,G.flags.metBruce?11000:8600);
}
function showEnd(){
  $('endTitle').textContent=fmt(CONFIG.endTitle);
  const set=(id,t)=>{ $(id).textContent=t; $(id).style.display=t?'':'none'; };
  set('endSub',fmt(CONFIG.endSubtitle));
  set('endHearts','♡ Hidden hearts found: '+G.hearts+' of '+HEART_TOTAL);
  set('endSecret',fmt(G.hearts>=HEART_TOTAL?CONFIG.secretMessage:CONFIG.unfoundMessage));
  STORE.completed=true; STORE.run=null; saveStore();
  $('end').classList.add('open'); G.mode='end'; sfx('end'); $('endNext').focus({preventScroll:true});
}
function playAgain(){ ['end','credits'].forEach(id=>$(id).classList.remove('open')); $('journal').classList.remove('open'); $('hud').classList.remove('hidden'); resetGame(); }
$('againBtn').addEventListener('click',playAgain);

/* ---------- loop ---------- */
function update(dt){
  time+=dt;
  if(!G) return;
  ambient(dt); updParticles(dt);
  if(room) room.npcs.forEach(n=>{ if(n.petT>0) n.petT=Math.max(0,n.petT-dt); }); if(G.emote&&G.emote.t>0) G.emote.t-=dt;
  if(G.mode==='note'){ tickNote(dt); return; }
  if(G.mode==='credits'){ tickCredits(dt); return; }
  if(G.mode==='mini'){ if(MINI){ MINI.update(dt); showSkip(); } return; }
  if(G.mode==='post'){ tickPost(dt); return; }
  if(fade){ fade.t+=dt*(fade.dir>0?3:2.5); if(fade.dir>0&&fade.t>=1){ fade.mid(); fade.dir=-1; fade.t=1; } else if(fade.dir<0){ fade.t-=dt*5; if(fade.t<=0) fade=null; } return; }
  if(dlg){ if(dlg.shown<dlg.full.length){ const before=Math.floor(dlg.shown); dlg.shown+=dt*txtSpeed(); const now=Math.floor(dlg.shown);
      if(now!==before){ $('dlgText').textContent=dlg.full.slice(0,now); if(now%3===0&&dlg.full[now-1]!==' ') sfx('blip',dlg.line.who); }
      if(dlg.shown>=dlg.full.length) finishTyping(); }
    wantInteract=false; return; }
  if(G.mode==='map'){ tickMap(dt); return; }
  if(G.mode!=='play'){ wantInteract=false; return; }
  if(room.task.type==='fireflies'&&room.task.started) updateFireflies(room,dt);
  salemChat(dt);
  if(!P.moving){
    const d=heldDir(); if(d||wantInteract) P.idle=0; else { P.idle+=dt; if(P.idle>1.2&&tileAt(P.x,P.y)==='K') earnSticker('coffee'); if(P.idle>60) earnSticker('patience'); }
    if(d){ P.dir=d; const [dx,dy]=DV[d];
      if(walkable(P.x+dx,P.y+dy)){ P.moving=true; P.tx=P.x+dx; P.ty=P.y+dy; P.mt=0; const F=G.follow; if(F){ F.x=F.tx; F.y=F.ty; F.tx=P.x; F.ty=P.y; } }
      else if(tileAt(P.x+dx,P.y+dy)==='D'&&!room.door.open&&!room.lockedMsg){ room.lockedMsg=true; sfx('bump'); say(D.doorLocked); }
    }
    if(wantInteract){ wantInteract=false; interact(); }
  }
  if(P.moving){ const sp=SPEED*(P.sliding?1.8:1); P.mt+=dt*sp; P.step+=dt*sp*.5;
    if(P.mt>=1){ P.x=P.tx; P.y=P.ty; P.moving=false; P.mt=0; if(!P.sliding&&Math.floor(P.step*2)%2===0) sfx('step'); onStep();
      if(!fade&&tileAt(P.x,P.y)==='~'){ const [dx,dy]=DV[P.dir];
        if(walkable(P.x+dx,P.y+dy)){ P.moving=true; P.sliding=true; P.tx=P.x+dx; P.ty=P.y+dy; const F=G.follow; if(F){ F.x=F.tx; F.y=F.ty; F.tx=P.x; F.ty=P.y; } }
        else { if(P.sliding) sfx('bump'); P.sliding=false; } }
      else P.sliding=false; } }
}
function draw(){
  ctx.clearRect(0,0,VW,VH);
  if(!room) return;
  if(G.mode==='map'){ drawMap(); if(fade){ ctx.fillStyle='rgba(14,10,22,'+Math.min(1,fade.t)+')'; ctx.fillRect(0,0,VW,VH); } return; }
  drawRoom(); drawEntities(); drawTask(); drawParticles();
  if(room.tint){ ctx.fillStyle=room.tint; ctx.fillRect(0,0,VW,VH); }
  if(room.vignette){ const g=ctx.createRadialGradient(120,90,50,120,90,165); g.addColorStop(0,'rgba(10,6,24,0)'); g.addColorStop(1,'rgba(10,6,24,'+room.vignette+')'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH); }
  if(MINI) MINI.draw();
  if(bubbles.length) bubbles.forEach(placeBubble);
  if(fade){ ctx.fillStyle='rgba(14,10,22,'+Math.min(1,fade.t)+')'; ctx.fillRect(0,0,VW,VH); }
}
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }

/* ---------- layout ---------- */
if(isTouch){ document.body.classList.add('touch'); $('controlsHint').textContent='Use the pad to walk. Tap ♡ to talk and read.'; }
function resize(){
  const portrait=innerHeight>innerWidth;
  document.body.classList.toggle('touch-portrait',isTouch&&portrait);
  const aw=innerWidth-20, ah=innerHeight-24-(isTouch&&portrait?200:0);
  let s=Math.max(1,Math.min(aw/VW,ah/VH)); if(s>=2) s=Math.floor(s*4)/4;
  const st=$('stage'); st.style.width=VW*s+'px'; st.style.height=VH*s+'px'; st.style.setProperty('--u',s+'px');
}
addEventListener('resize',()=>{ resize(); bubbles.forEach(placeBubble); }); resize();

/* ---------- boot ---------- */
$('titleText').textContent=fmt(CONFIG.title); $('subtitleText').textContent=fmt(CONFIG.subtitle); document.title=fmt(CONFIG.title);
resetGame('title'); clearTimeout(enterRoom.t); $('roomName').classList.remove('show');
/* ---------- title, intro, continue ---------- */
function refreshTitle(){
  $('continueBtn').hidden=!STORE.run; $('lettersBtn').hidden=!STORE.notesRead.length;
  $('startBtn').textContent=STORE.run?'New game':'Start';
  (STORE.run?$('continueBtn'):$('startBtn')).focus({preventScroll:true});
}
function beginAudio(){ initAudio(); if(AC&&AC.state==='suspended') AC.resume(); applySettings(); }
function start(){
  if(G.mode!=='title') return; beginAudio(); $('title').classList.remove('open');
  playIntro(()=>{ $('hud').classList.remove('hidden'); sfx('start'); resetGame(); setTimeout(()=>showPart(0),300); });
}
function continueGame(){
  if(G.mode!=='title'||!STORE.run) return; const run=STORE.run; beginAudio();
  $('title').classList.remove('open'); $('hud').classList.remove('hidden'); sfx('start');
  resetGame('resume'); G.mode='play'; G.flags.woke=true;
  G.hearts=run.hearts||0; G.taken=(run.taken||[]).slice(); G.badges=(run.badges||[]).slice(); G.flags.metBruce=!!run.bruce; G.flags.bruceTalks=run.bruceTalks||0; G.bruceSeen=(run.bruceSeen||[]).slice();
  rooms.forEach(r=>r.items.forEach(it=>{ if(it.type==='heart'&&G.taken.includes(r.index+':'+it.x+','+it.y)) it.taken=true; }));
  if(run.room>=2&&run.room<rooms.length-1){ G.follow={id:'salem',x:0,y:0,tx:0,ty:0}; rooms[1].npcs=[]; }
  updateHud(); updateBadges(); enterRoom(run.room); setTimeout(()=>toast('Welcome back'),600);
}
let introT=[];
function playIntro(cb){
  G.mode='intro'; G.introCb=cb; G.introAt=performance.now();
  const o=$('intro'); o.classList.remove('out'); o.classList.add('open');
  $('introL1').textContent=fmt(CONFIG.intro[0]); $('introL2').textContent=fmt(CONFIG.intro[1]);
  $('introSkip').textContent=isTouch?'Tap to begin':'Press Enter to begin';
  ['introL1','introL2','introSkip'].forEach(id=>$(id).classList.remove('show'));
  introT=[setTimeout(()=>$('introL1').classList.add('show'),500), setTimeout(()=>$('introL2').classList.add('show'),2700),
          setTimeout(()=>$('introSkip').classList.add('show'),4300), setTimeout(finishIntro,9500)];
}
function finishIntro(){
  if(!G||G.mode!=='intro'||performance.now()-G.introAt<700) return;
  introT.forEach(clearTimeout); const o=$('intro'), cb=G.introCb; G.introCb=null;
  o.classList.add('out'); setTimeout(()=>o.classList.remove('open','out'),900); if(cb) cb();
}
$('intro').addEventListener('pointerdown',finishIntro);

/* ---------- journal: reread letters, see hearts, badges, secrets ---------- */
function openJournal(){
  if(!G||G.mode==='journal') return; G.jPrev=G.mode; G.mode='journal'; held.clear(); touchDir=null;
  renderJournal(); $('journal').classList.add('open'); $('jClose').focus({preventScroll:true}); sfx('page');
}
function closeJournal(){ $('journal').classList.remove('open'); G.mode=G.jPrev||'play'; if(G.mode==='title') refreshTitle(); }
function renderJournal(){
  const b=$('jBody'); b.innerHTML='';
  const h=t=>{ const e=document.createElement('h3'); e.textContent=t; b.appendChild(e); };
  h('Letters');
  const g=document.createElement('div'); g.className='jletters';
  CONFIG.notes.forEach((n,i)=>{ const read=STORE.notesRead.includes(i), bt=document.createElement('button');
    bt.textContent=read?CONFIG.noteTitles[i]:'Sealed'; bt.disabled=!read; if(read) bt.addEventListener('click',()=>openNote(i,null,true)); g.appendChild(bt); });
  b.appendChild(g);
  h('Hearts  '+STORE.traits.length+' / '+HEART_TOTAL);
  const ul=document.createElement('ul'); ul.className='jhearts';
  CONFIG.heartNotes.forEach((t,i)=>{ const li=document.createElement('li'), f=STORE.traits.includes(i); li.textContent=f?fmt(t):'Still hidden somewhere…'; if(!f) li.className='locked'; ul.appendChild(li); });
  b.appendChild(ul);
  h('Badges');
  const bd=document.createElement('div'); bd.className='jbadges';
  CONFIG.badges.forEach((x,i)=>{ const s=document.createElement('span'), got=!!STORE.badges[i]; s.textContent=(got?'◆ ':'◇ ')+(got?x.name:'???'); s.style.color=got?x.color:'#6f6488'; bd.appendChild(s); });
  b.appendChild(bd);
  h('Wardrobe');
  const wd=document.createElement('div'), SL={head:'Head',clip:'Hair',neck:'Neck'}; STORE.outfit=STORE.outfit||{};
  Object.keys(SL).forEach(slot=>{ const row=document.createElement('div'); row.className='jrow'; const lab=document.createElement('span'); lab.textContent=SL[slot]; row.appendChild(lab);
    const mk=(oid,name,locked)=>{ const bt=document.createElement('button'); bt.textContent=locked?'???':name; bt.disabled=!!locked; if((STORE.outfit[slot]||null)===oid) bt.classList.add('on');
      bt.addEventListener('click',()=>{ STORE.outfit[slot]=oid; if(oid){ addUnique(STORE.tried,oid); if(STORE.tried.length>=5) earnSticker('fashion'); } saveStore(); sfx('pick'); renderJournal(); }); row.appendChild(bt); };
    mk(null,'None'); CONFIG.outfits.forEach((o,i)=>{ if(o.slot===slot) mk(o.id,o.name,!STORE.badges[i]); });
    wd.appendChild(row); });
  b.appendChild(wd);
  if(getPhoto()){ h('Keepsake'); const pb=document.createElement('button'); pb.textContent='View your photo'; pb.addEventListener('click',openPhoto); b.appendChild(pb); }
  h('Stickers  '+STORE.stickers.length+' / '+CONFIG.stickers.length);
  const sk=document.createElement('div'); sk.className='jstick';
  CONFIG.stickers.forEach(x=>{ const got=STORE.stickers.includes(x.id), d=document.createElement('div'); d.className='jst'+(got?'':' locked');
    d.innerHTML=''; const n=document.createElement('b'); n.textContent=(got?'★ ':'☆ ')+(got?fmt(x.name):'???'); const ds=document.createElement('small'); ds.textContent=got?fmt(x.desc):'Keep exploring…'; d.appendChild(n); d.appendChild(ds); sk.appendChild(d); });
  b.appendChild(sk);
  h('Secrets');
  const p=document.createElement('p'); p.style.margin='0';
  p.textContent=STORE.bruce?'Bruce sightings: '+STORE.bruceSeen.length+' / 5. '+(STORE.bruceSeen.length>=5?'You found him everywhere. He is pretending not to be impressed.':'He is hiding somewhere else too…'):'Somebody is hiding somewhere…'; if(!STORE.bruce) p.className='locked'; b.appendChild(p);
  h('Settings');
  const st=document.createElement('div'); st.className='jset'; const S=STORE.settings;
  const slider=(label,key)=>{ const row=document.createElement('label'); row.className='jrow'; const sp=document.createElement('span'); sp.textContent=label; const r=document.createElement('input'); r.type='range'; r.min=0; r.max=100; r.value=Math.round(S[key]*100);
    r.addEventListener('input',()=>{ S[key]=r.value/100; saveStore(); applySettings(); }); row.appendChild(sp); row.appendChild(r); st.appendChild(row); };
  const choice=(label,key,opts)=>{ const row=document.createElement('div'); row.className='jrow'; const sp=document.createElement('span'); sp.textContent=label; row.appendChild(sp);
    opts.forEach(([v,t])=>{ const bt=document.createElement('button'); bt.textContent=t; if(S[key]===v) bt.classList.add('on'); bt.addEventListener('click',()=>{ S[key]=v; saveStore(); applySettings(); renderJournal(); }); row.appendChild(bt); }); st.appendChild(row); };
  slider('Music','music'); slider('Sounds','sfx');
  choice('Text','textSize',[['normal','Normal'],['large','Large']]);
  choice('Speed','textSpeed',[['normal','Normal'],['fast','Fast'],['instant','Instant']]);
  b.appendChild(st);
}
$('jClose').addEventListener('click',closeJournal);
$('journal').addEventListener('pointerdown',e=>{ if(e.target.id==='journal') closeJournal(); });
$('journalBtn').addEventListener('click',e=>{ e.currentTarget.blur(); if(G&&G.mode==='play'&&!dlg) openJournal(); });
$('lettersBtn').addEventListener('click',openJournal);
$('lettersBtn2').addEventListener('click',openJournal);
$('musicBtn').addEventListener('click',e=>e.currentTarget.blur());

/* ---------- credits ---------- */
function showCredits(){
  $('end').classList.remove('open'); G.mode='credits'; G.credFast=false;
  const roll=$('creditsRoll'); roll.innerHTML='';
  const add=(cls,t)=>{ const d=document.createElement('div'); d.className=cls; d.textContent=t; roll.appendChild(d); };
  add('big',fmt(CONFIG.title));
  const C=CONFIG.credits;
  [['Starring',CONFIG.herName]].concat(C.cast.map(([role,id])=>[role,SPEAKERS[id].name()])).forEach(([r,n])=>{ add('role',r); add('name',n); });
  const bruce=G.flags.metBruce||STORE.bruce; add('role','Also appearing'); add('name',bruce?C.bruceFound:C.bruceMissing);
  C.outro.forEach(l=>add('line',fmt(l)));
  $('creditsEnd').classList.remove('show'); $('credits').classList.add('open');
  G.credY=$('stage').clientHeight; roll.style.transform='translateY('+G.credY+'px)';
}
function tickCredits(dt){
  const roll=$('creditsRoll'), H=$('stage').clientHeight, stop=H*.42-roll.offsetHeight;
  if(G.credY>stop){ G.credY=Math.max(stop,G.credY-dt*H/(G.credFast?1.2:6.5)); roll.style.transform='translateY('+Math.round(G.credY)+'px)'; }
  else if(!$('creditsEnd').classList.contains('show')){ if(!G.postShown) return startPost(); $('creditsEnd').classList.add('show'); $('photoBtn').hidden=!getPhoto(); $('lettersBtn2').focus({preventScroll:true}); }
}
$('endNext').addEventListener('click',showCredits);
$('creditsSkip').addEventListener('click',()=>{ G.credFast=true; });

$('startBtn').addEventListener('click',start);
$('continueBtn').addEventListener('click',continueGame);
document.body.classList.toggle('bigtext',STORE.settings.textSize==='large');
refreshTitle();
requestAnimationFrame(loop);
</script>
