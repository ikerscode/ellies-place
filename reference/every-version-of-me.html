<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ellie's Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#cfc6db; --ink:#efe6f5; --box:#221c2d; --box-edge:#0f0b14; --box-inner:#3d3452; --lav:#c9a2ff; --wine:#7a2c4a; --muted:#9d90b3; --paper:#efe4d0; --paper-ink:#2a2030;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#15121c; } }
:root[data-theme="dark"]{ --page:#15121c; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; background:var(--page); color:var(--ink);
  font-family:"Pixelify Sans", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
body.touch-portrait{ align-items:flex-start; padding-top:14px; }
#stage{ position:relative; --u:3px; border-radius:calc(var(--u)*3); overflow:hidden;
  box-shadow:0 0 0 calc(var(--u)*1.5) var(--box-edge), 0 calc(var(--u)*4) calc(var(--u)*10) rgba(10,6,16,.45); }
canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }

#hud{ position:absolute; top:calc(var(--u)*4); left:calc(var(--u)*4); right:calc(var(--u)*4); display:flex; align-items:center; pointer-events:none; }
.chip{ background:rgba(34,28,45,.9); border:calc(var(--u)*.8) solid var(--box-edge); border-radius:calc(var(--u)*3); color:var(--ink);
  padding:calc(var(--u)*1) calc(var(--u)*3); font-size:max(calc(var(--u)*6),12px); line-height:1.15; }
#musicBtn{ pointer-events:auto; cursor:pointer; font-family:inherit; }
#hud.hidden{ display:none; }
#roomName{ position:absolute; top:calc(var(--u)*18); left:50%; transform:translateX(-50%); white-space:nowrap;
  font-size:max(calc(var(--u)*9),16px); font-weight:700; color:var(--ink); letter-spacing:.02em;
  text-shadow:0 calc(var(--u)*.8) 0 var(--box-edge), 0 0 calc(var(--u)*6) rgba(201,162,255,.6);
  opacity:0; transition:opacity .8s; pointer-events:none; }
#roomName.show{ opacity:1; }
#partCard{ position:absolute; left:0; right:0; top:42%; text-align:center; pointer-events:none; opacity:0; transition:opacity 1s;
  font-family:"IM Fell English", Georgia, serif; font-style:italic; font-size:max(calc(var(--u)*11),22px); color:var(--ink); text-shadow:0 calc(var(--u)*.8) 0 var(--box-edge), 0 0 calc(var(--u)*10) rgba(201,162,255,.5); }
#partCard.show{ opacity:1; }
body.bigtext #dlgText{ font-size:max(calc(var(--u)*8.2),17px); }
body.bigtext #note .paper{ font-size:clamp(20px, 1.3vw + 14px, 25px); }
body.bigtext .bubble{ font-size:max(calc(var(--u)*6.4),13px); }
body.bigtext #panelText{ font-size:max(calc(var(--u)*7.8),15px); }
#toast{ position:absolute; top:calc(var(--u)*16); left:50%; transform:translate(-50%,-10px); max-width:84%;
  text-align:center; opacity:0; transition:opacity .35s, transform .35s; pointer-events:none; }
#toast.show{ opacity:1; transform:translate(-50%,0); }

#dialog{ position:absolute; left:calc(var(--u)*5); right:calc(var(--u)*5); bottom:calc(var(--u)*5);
  background:var(--box); border:calc(var(--u)*1.2) solid var(--box-edge); border-radius:calc(var(--u)*3);
  box-shadow: inset 0 0 0 calc(var(--u)*1) var(--box-inner); padding:calc(var(--u)*4); display:none; gap:calc(var(--u)*4); cursor:pointer; min-height:calc(var(--u)*42); }
#dialog.open{ display:flex; }
#portraitWrap{ flex:0 0 auto; width:max(calc(var(--u)*30),46px); height:max(calc(var(--u)*30),46px); background:#352c46; border:calc(var(--u)*.8) solid var(--box-edge); border-radius:calc(var(--u)*2); display:flex; align-items:center; justify-content:center; }
#portraitWrap.none{ display:none; }
#portrait{ width:90%; height:90%; image-rendering:pixelated; }
#dlgBody{ flex:1; min-width:0; display:flex; flex-direction:column; }
#dlgName{ font-weight:700; font-size:max(calc(var(--u)*6.5),13px); color:var(--lav); margin-bottom:calc(var(--u)*1.5); }
#dlgText{ font-size:max(calc(var(--u)*6.8),14px); line-height:1.3; flex:1; }
#dlgNext{ align-self:flex-end; font-size:max(calc(var(--u)*5.5),11px); color:var(--muted); animation:bob 1s steps(2) infinite; }
@keyframes bob{ 50%{ transform:translateY(calc(var(--u)*-1)); } }

.overlay{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; }
.overlay.open{ display:flex; }
#title{ background:linear-gradient(rgba(14,10,22,.62), rgba(14,10,22,.82)); }
#title h1{ margin:0; font-size:max(calc(var(--u)*17),26px); line-height:1; color:var(--ink); font-weight:700;
  text-shadow:0 calc(var(--u)*1.4) 0 var(--box-edge), 0 0 calc(var(--u)*10) rgba(201,162,255,.55); }
#title p{ margin:calc(var(--u)*5) 0 calc(var(--u)*8); font-size:max(calc(var(--u)*7),13px); color:var(--lav); }
.btn{ font-family:inherit; font-weight:700; font-size:max(calc(var(--u)*8),15px); color:var(--ink); background:var(--wine);
  border:calc(var(--u)*1.2) solid var(--box-edge); border-radius:calc(var(--u)*3); padding:calc(var(--u)*2.5) calc(var(--u)*9);
  box-shadow:0 calc(var(--u)*1.5) 0 var(--box-edge); cursor:pointer; }
.btn:active{ transform:translateY(calc(var(--u)*1)); box-shadow:0 calc(var(--u)*.5) 0 var(--box-edge); }
.btn:focus-visible{ outline:calc(var(--u)*1) solid var(--lav); outline-offset:calc(var(--u)*1); }
#title small{ margin-top:calc(var(--u)*7); font-size:max(calc(var(--u)*5),11px); color:var(--muted); }

#end{ background:rgba(14,10,22,.5); padding:0 12%; }
#end h2{ margin:0 0 calc(var(--u)*4); font-size:max(calc(var(--u)*11),22px); line-height:1.15; text-shadow:0 calc(var(--u)*1.2) 0 var(--box-edge), 0 0 calc(var(--u)*10) rgba(255,200,120,.5); }
#end p{ font-size:max(calc(var(--u)*6.5),13px); margin:calc(var(--u)*3) 0; text-shadow:0 calc(var(--u)*.6) 0 var(--box-edge); }
#end .btn{ margin-top:calc(var(--u)*5); font-size:max(calc(var(--u)*6.5),14px); }

#bubbles{ position:absolute; inset:0; pointer-events:none; }
.bubble{ position:absolute; width:max-content; max-width:calc(var(--u)*92); background:#fbf6ee; color:#2a2030;
  border:calc(var(--u)*.8) solid var(--box-edge); border-radius:calc(var(--u)*3); padding:calc(var(--u)*1.8) calc(var(--u)*3.2);
  font-size:max(calc(var(--u)*5.4),11px); line-height:1.25; text-align:center; box-shadow:0 calc(var(--u)*1) 0 rgba(10,6,16,.35);
  opacity:0; transition:opacity .3s; }
.bubble.show{ opacity:1; animation:pop .35s ease-out; }
.bubble::after{ content:""; position:absolute; left:var(--tail,50%); bottom:calc(var(--u)*-2.4); width:calc(var(--u)*3.6); height:calc(var(--u)*3.6);
  background:#fbf6ee; border-right:calc(var(--u)*.8) solid var(--box-edge); border-bottom:calc(var(--u)*.8) solid var(--box-edge); transform:translateX(-50%) rotate(45deg); }
.bubble.below::after{ bottom:auto; top:calc(var(--u)*-2.4); border:none; border-left:calc(var(--u)*.8) solid var(--box-edge); border-top:calc(var(--u)*.8) solid var(--box-edge); }
@keyframes pop{ 0%{ transform:scale(.6); } 70%{ transform:scale(1.06); } 100%{ transform:scale(1); } }

#taskChip{ color:var(--lav); }
#hud{ gap:calc(var(--u)*2); }
#badgeChip{ letter-spacing:.12em; margin-right:auto; }
#miniPanel{ position:absolute; left:calc(var(--u)*5); right:calc(var(--u)*5); bottom:calc(var(--u)*12); background:var(--box); border:calc(var(--u)*1.2) solid var(--box-edge);
  border-radius:calc(var(--u)*3); box-shadow:inset 0 0 0 calc(var(--u)*1) var(--box-inner); padding:calc(var(--u)*4); pointer-events:auto; cursor:pointer; }
#miniPanel.hidden{ display:none; }
#panelText{ font-size:max(calc(var(--u)*6.5),13px); line-height:1.3; min-height:2.6em; }
#panelMoves{ display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*2); margin-top:calc(var(--u)*2); }
#panelMoves button{ font-family:inherit; font-size:max(calc(var(--u)*6),12px); text-align:left; color:var(--ink); background:#2d2640;
  border:calc(var(--u)*.7) solid var(--box-edge); border-radius:calc(var(--u)*2); padding:calc(var(--u)*1.5) calc(var(--u)*3); cursor:pointer; }
#panelMoves button.sel, #panelMoves button:hover{ background:var(--wine); }
#mini{ position:absolute; inset:0; pointer-events:none; }
#mini.hidden{ display:none; }
#miniTop{ position:absolute; top:calc(var(--u)*4); left:50%; transform:translateX(-50%); display:flex; gap:calc(var(--u)*4); white-space:nowrap; }
#miniTitle{ color:var(--lav); }
#miniSkip{ position:absolute; top:calc(var(--u)*4); left:calc(var(--u)*4); pointer-events:auto; cursor:pointer; font-family:inherit; display:none; color:var(--lav); }
#miniSkip.show{ display:block; }
#photo{ position:fixed; inset:0; z-index:46; background:rgba(12,9,18,.86); display:none; align-items:center; justify-content:center; padding:16px; }
#photo.open{ display:flex; }
.pcard{ width:min(560px,100%); max-height:100%; overflow-y:auto; text-align:center; }
.pcard img{ width:100%; display:block; transform:rotate(-1.5deg); box-shadow:0 18px 50px rgba(0,0,0,.55); border-radius:2px; image-rendering:pixelated; }
.phint{ color:#9d90b3; font-size:14px; margin:18px 0 10px; }
.pbtns{ display:flex; gap:10px; justify-content:center; }
.pbtns button{ font-family:"Pixelify Sans", system-ui, sans-serif; font-size:16px; color:#efe6f5; background:#7a2c4a; border:2px solid #0f0b14; border-radius:8px; padding:9px 18px; cursor:pointer; }
.pbtns button + button{ background:#3d3452; }
.jrow{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
.jrow span{ width:52px; color:#9d90b3; font-size:14px; }
.jrow input[type=range]{ flex:1; max-width:260px; accent-color:#c9a2ff; }
.jstick{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; }
.jst{ background:#2d2640; border:2px solid #0f0b14; border-radius:8px; padding:8px 10px; }
.jst b{ display:block; font-weight:600; color:#ffe066; font-size:15px; }
.jst small{ color:#c9bfd8; font-size:13px; }
.jst.locked b{ color:#6f6488; } .jst.locked small{ color:#6f6488; font-style:italic; }
.jcard button.on{ background:#7a2c4a; box-shadow:0 0 0 2px #c9a2ff; }
#miniQuit{ position:absolute; top:calc(var(--u)*4); right:calc(var(--u)*4); pointer-events:auto; cursor:pointer; font-family:inherit; }
#miniMsg{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:90%; text-align:center; white-space:pre-line;
  font-size:max(calc(var(--u)*8),15px); font-weight:700; line-height:1.35; color:var(--ink);
  text-shadow:0 calc(var(--u)*.8) 0 var(--box-edge), 0 0 calc(var(--u)*8) rgba(201,162,255,.55); }
#miniHint{ position:absolute; bottom:calc(var(--u)*3); left:0; right:0; text-align:center; font-size:max(calc(var(--u)*5),11px); color:var(--muted); }

.titleBtns{ display:flex; gap:calc(var(--u)*4); flex-wrap:wrap; justify-content:center; }
.btn[hidden]{ display:none; }
.btn.ghost{ background:transparent; box-shadow:none; border-color:var(--muted); color:var(--ink); }
#intro{ background:#0c0911; padding:0 12%; }
#intro.out{ opacity:0; transition:opacity .9s; }
#intro p{ font-family:"IM Fell English", Georgia, "Times New Roman", serif; font-style:italic; font-size:max(calc(var(--u)*9),18px); color:var(--ink); margin:calc(var(--u)*3) 0; opacity:0; transition:opacity 1.6s; }
#intro p.show, #introSkip.show{ opacity:1; }
#introSkip{ opacity:0; transition:opacity 1s; margin-top:calc(var(--u)*10); color:var(--muted); font-size:max(calc(var(--u)*5),11px); }
#credits{ background:#0c0911; overflow:hidden; justify-content:flex-start; }
#creditsRoll{ position:absolute; left:0; right:0; top:0; text-align:center; will-change:transform; }
#creditsRoll .big{ font-family:"IM Fell English", Georgia, serif; font-size:max(calc(var(--u)*13),24px); color:var(--ink); }
#creditsRoll .role{ font-size:max(calc(var(--u)*4.8),10px); color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:calc(var(--u)*8); }
#creditsRoll .name{ font-size:max(calc(var(--u)*8.5),16px); font-weight:700; color:var(--lav); margin-top:calc(var(--u)*1); }
#creditsRoll .line{ font-family:"IM Fell English", Georgia, serif; font-style:italic; font-size:max(calc(var(--u)*6.5),14px); color:var(--ink); margin:calc(var(--u)*12) auto 0; max-width:80%; line-height:1.4; }
#creditsEnd{ position:absolute; bottom:calc(var(--u)*10); left:0; right:0; display:flex; justify-content:center; gap:calc(var(--u)*4); flex-wrap:wrap; opacity:0; pointer-events:none; transition:opacity 1.2s; }
#creditsEnd.show{ opacity:1; pointer-events:auto; }
#creditsEnd .btn{ font-size:max(calc(var(--u)*6.5),14px); }
#creditsSkip{ position:absolute; top:calc(var(--u)*4); right:calc(var(--u)*4); cursor:pointer; font-family:inherit; }
#journalBtn{ cursor:pointer; font-family:inherit; pointer-events:auto; margin-right:calc(var(--u)*2); }
#journal{ position:fixed; inset:0; z-index:45; background:rgba(12,9,18,.84); display:none; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px)); }
#journal.open{ display:flex; }
.jcard{ width:min(640px,100%); max-height:100%; overflow-y:auto; background:#221c2d; color:#efe6f5; border:3px solid #0f0b14; border-radius:10px;
  box-shadow:inset 0 0 0 3px #3d3452, 0 24px 60px rgba(0,0,0,.5); padding:clamp(18px,4vw,32px); font-size:16px; line-height:1.45; }
.jhead{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
.jhead h2{ margin:0; font-family:"IM Fell English", Georgia, serif; font-weight:400; font-size:28px; }
.jcard h3{ margin:22px 0 10px; font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:#c9a2ff; font-weight:600; }
.jcard button{ font-family:"Pixelify Sans", system-ui, sans-serif; font-size:15px; color:#efe6f5; background:#3d3452; border:2px solid #0f0b14; border-radius:8px; padding:8px 14px; cursor:pointer; }
.jcard button:hover:not(:disabled){ background:#7a2c4a; }
.jcard button:disabled{ opacity:.45; cursor:default; }
.jcard button:focus-visible{ outline:3px solid #c9a2ff; outline-offset:2px; }
.jletters{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.jhearts{ margin:0; padding-left:1.2em; font-family:"IM Fell English", Georgia, serif; font-size:17px; }
.jhearts li{ margin:6px 0; }
.jcard .locked{ color:#6f6488; font-style:italic; }
.jbadges{ display:flex; flex-wrap:wrap; gap:8px 18px; }

/* The notes: full-screen so they're comfortable to read on any device */
#note{ position:fixed; inset:0; z-index:50; background:rgba(12,9,18,.8); display:none; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px)); }
#note.open{ display:flex; }
#note .paper{ position:relative; width:min(620px,100%); max-height:100%; overflow-y:auto; background:var(--paper); color:var(--paper-ink);
  border-radius:4px; padding:clamp(22px,4.5vw,44px); transform:rotate(-.4deg);
  box-shadow:0 0 0 3px #0f0b14, inset 0 0 60px rgba(122,90,60,.18), 0 24px 60px rgba(0,0,0,.55);
  font-family:"IM Fell English", Georgia, "Times New Roman", serif; font-size:clamp(17px, 1vw + 13px, 21px); line-height:1.62; }
.noteHead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-family:"Pixelify Sans", system-ui, sans-serif; font-size:15px; color:var(--wine); }
#timer{ position:relative; width:56px; height:56px; flex:0 0 auto; }
#timer svg{ width:100%; height:100%; transform:rotate(-90deg); }
#timer circle{ fill:none; stroke-width:4; }
#timer .track{ stroke:#d9ccb8; }
#ring{ stroke:var(--wine); stroke-linecap:round; stroke-dasharray:113.1; }
#timerNum{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:"Pixelify Sans", system-ui, sans-serif; font-size:24px; font-weight:700; color:var(--wine); }
#timer.nudge{ animation:nudge .35s; }
@keyframes nudge{ 25%{ transform:translateX(-4px);} 75%{ transform:translateX(4px);} }
#noteBody p{ margin:0 0 1em; }
#noteBody .sig{ font-style:italic; color:var(--wine); margin-top:1.4em; }
#noteBtn{ font-family:"Pixelify Sans", system-ui, sans-serif; font-weight:700; font-size:17px; color:#efe6f5; background:var(--wine);
  border:3px solid #0f0b14; border-radius:8px; padding:10px 26px; box-shadow:0 4px 0 #0f0b14; cursor:pointer; margin-top:8px; }
#noteBtn:disabled{ background:#a8989a; cursor:default; box-shadow:0 4px 0 #6d6264; }
#noteBtn:focus-visible{ outline:3px solid var(--lav); outline-offset:3px; }
.noteFoot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.noteFoot small{ font-family:"Pixelify Sans", system-ui, sans-serif; font-size:13px; color:#8a7568; }

.touch-ui{ display:none; }
body.touch .touch-ui{ display:block; }
#pad{ position:fixed; left:22px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); width:150px; height:150px; border-radius:50%;
  background:rgba(34,28,45,.8); border:3px solid var(--box-edge); touch-action:none; }
#pad::before,#pad::after{ content:""; position:absolute; background:rgba(201,162,255,.25); border-radius:8px; }
#pad::before{ left:50%; top:16%; width:30%; height:68%; transform:translateX(-50%); }
#pad::after{ top:50%; left:16%; height:30%; width:68%; transform:translateY(-50%); }
#abtn{ position:fixed; right:26px; bottom:calc(46px + env(safe-area-inset-bottom,0px)); width:86px; height:86px; border-radius:50%;
  background:var(--wine); border:3px solid var(--box-edge); box-shadow:0 5px 0 var(--box-edge); font-size:38px; color:#efe6f5; font-family:inherit; touch-action:none; }
#abtn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--box-edge); }
@media (prefers-reduced-motion: reduce){ #dlgNext, #timer.nudge, .bubble.show{ animation:none; } #note .paper{ transform:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="240" height="160"></canvas>
  <div id="hud" class="hidden"><span class="chip" id="heartChip">♡ 0/5</span><span class="chip" id="badgeChip" aria-label="Badges"></span><span class="chip" id="taskChip" style="display:none"></span><button class="chip" id="journalBtn" aria-label="Journal" title="Journal (J)">✉</button><button class="chip" id="musicBtn" aria-label="Toggle music">♪ on</button></div>
  <div id="roomName"></div>
  <div id="partCard"></div>
  <div id="toast" class="chip"></div>
  <div id="mini" class="hidden">
    <div id="miniTop" class="chip"><b id="miniTitle"></b><span id="miniInfo"></span></div>
    <button id="miniQuit" class="chip" aria-label="Leave minigame">✕ Leave</button>
    <button id="miniSkip" class="chip">Skip ›</button>
    <div id="miniMsg" aria-live="polite"></div>
    <div id="miniHint"></div>
    <div id="miniPanel" class="hidden"><div id="panelText"></div><div id="panelMoves"></div></div>
  </div>
  <div id="bubbles" aria-live="polite"></div>
  <div id="dialog" role="dialog" aria-live="polite">
    <div id="portraitWrap"><canvas id="portrait" width="20" height="20"></canvas></div>
    <div id="dlgBody"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgNext">▼</div></div>
  </div>
  <div id="title" class="overlay open">
    <h1 id="titleText"></h1>
    <p id="subtitleText"></p>
    <div class="titleBtns"><button class="btn" id="continueBtn" hidden>Continue</button><button class="btn" id="startBtn">Start</button><button class="btn ghost" id="lettersBtn" hidden>Letters</button></div>
    <small id="controlsHint">Arrow keys or WASD to walk. E, Space or Enter to talk.</small>
  </div>
  <div id="end" class="overlay"><h2 id="endTitle"></h2><p id="endSub"></p><p id="endHearts"></p><p id="endSecret"></p><button class="btn" id="endNext">Continue</button></div>
  <div id="credits" class="overlay"><div id="creditsRoll"></div><div id="creditsEnd"><button class="btn" id="lettersBtn2">Read the letters</button><button class="btn ghost" id="photoBtn" hidden>Keepsake photo</button><button class="btn ghost" id="againBtn">Play again</button></div><button class="chip" id="creditsSkip">Skip</button></div>

`It was 2018. I was still a boy when I met you, and yet I knew in that very first moment exactly what kind of woman every other would be measured against.

I have lost count of the sleepless nights I've spent wishing I had been man enough back then to take you away from everything the world was putting you through. Instead, I stood at my own door and watched you leave with someone who never understood what he was holding.`,

`At first, it was your eyes. I still remember how hard it was to admire them without your boyfriend noticing.

I think that in that moment, when you did something as simple as look at me, I already knew what I wanted.`,

`Since the day we met, one quiet truth has lived in the back of my mind: that no one I have been with was ever truly the one.

For a long time I called it bad luck. It wasn't. I had already met the one. I simply wasn't yet worthy of her.`,

`When I've got my arms around you, my head finally goes quiet. All the noise about who I should be and where I'm going stops, and there's just you, warm against me, your head resting on my chest like it's the easiest thing in the world.

After a moment you relax, properly, and I feel you breathe out. I always hold on a bit longer than I should. If you've noticed, you've been kind enough not to mention it.`,

`Time and time again, fate let our paths cross. And time and time again, you met a version of me that couldn't give you what you deserved.

Or perhaps, if I'm honest, a version of me too afraid to believe that he could.`,

`I watched you go through things, and I lent an ear whenever you needed to speak. But not once did I listen and think, "Poor {name}, what a shame."

It was always, "How strong she is." And then, "If only I could match her strength."`,

`I have grown since then. I know I have. And still, in your presence, I feel like a man standing beneath a balcony he will never be tall enough to reach.

When you speak, I hear the very words I would have chosen myself. When I look at you, I see something I have searched for across years and continents, and never once found anywhere else.

And so I arrive at the same conclusion every time. Even if I were a king, even if I could free myself from every one of my flaws, I would still look at you and believe the very same thing: that you deserve more than any man could offer you. Including the man I am today.`,

`You never asked me to be better. Not once have you made me feel like less of a man, or like I wasn't worth your time.

And I suspect that if you could see yourself through my eyes, you'd realise just how much better you deserve.`,

`I've spent so many nights lying there, wishing things were different. I picture a life where I could be in the Colosseum having the time of my life, or on a yacht off Sardinia, and if you asked me over for something as simple as a game of cards at home, I'd make my way to you without a second's hesitation.

I dream of a time when that's just normal.`,

`So I leave. Another journey, another season of becoming a better man. And this time, I walk it alone.

Because if the road isn't one I can walk beside you, I would rather walk it by myself.

I only understood this recently, after seeing you again. No matter how I feel about myself, no matter what I achieve or who I become, you will always be my kryptonite.`,

`It breaks my heart to step onto this flight. Believe me, I've played this moment out hundreds of times since seeing you again.

I've thought about missing it. I've thought about taking you with me.`,

`I know you may not fully understand why I feel this way, about you, about myself, about us. Perhaps I don't fully understand it either.

But know this: beneath all of it, I only ever want what is best for you.

And if, by the time I have become the man I'm trying to be, you still haven't found it, I'll be there, if you'll have me. Somehow, I always find my way back to you.`

function makeSprite(rows,pal,outline=OUT){
  const h=rows.length, w=rows[0].length;
  const c=document.createElement('canvas'); c.width=w+2; c.height=h+2;
  const g=c.getContext('2d');
  const on=(x,y)=>y>=0&&y<h&&x>=0&&x<w&&rows[y][x]!=='.';
  g.fillStyle=outline;
  for(let y=-1;y<=h;y++) for(let x=-1;x<=w;x++)
    if(!on(x,y)&&(on(x-1,y)||on(x+1,y)||on(x,y-1)||on(x,y+1))) g.fillRect(x+1,y+1,1,1);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const ch=rows[y][x]; if(ch!=='.'&&pal[ch]){ g.fillStyle=pal[ch]; g.fillRect(x+1,y+1,1,1);} }
  return c;
}

/* ---------- audio: everything is synthesised live, so it works offline ---------- */
let AC=null, master, musicBus, ambBus, sfxBus, miniBus, verb, noiseBuf, musicOn=true;
let MUSIC_VOL=0.6, AMB_VOL=0.55;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.connect(AC.destination);
    master=AC.createGain(); master.gain.value=2.6; master.connect(comp);
    verb=AC.createConvolver(); verb.buffer=makeImpulse(2.8,2.6); const vg=AC.createGain(); vg.gain.value=0.4; verb.connect(vg); vg.connect(master);
    musicBus=AC.createGain(); musicBus.gain.value=0.0001; musicBus.connect(master);
    const ms=AC.createGain(); ms.gain.value=0.7; musicBus.connect(ms); ms.connect(verb);
    ambBus=AC.createGain(); ambBus.gain.value=musicOn?AMB_VOL:0; ambBus.connect(master);
    sfxBus=AC.createGain(); sfxBus.gain.value=1; sfxBus.connect(master);
    miniBus=AC.createGain(); miniBus.gain.value=0.75; miniBus.connect(master); const mbs=AC.createGain(); mbs.gain.value=.5; miniBus.connect(mbs); mbs.connect(verb);
    const ss=AC.createGain(); ss.gain.value=0.25; sfxBus.connect(ss); ss.connect(verb);
    noiseBuf=makeNoise(2);
    startAmbience(); startMusicLoop();
  }catch(e){ AC=null; }
}
function makeImpulse(sec,decay){ const len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(2,len,AC.sampleRate); for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); } return b; }
function makeNoise(sec){ const len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return b; }
function env(g,t,a,peak,d){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function osc(type,f,t,dur,dest){ const o=AC.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.connect(dest); o.start(t); o.stop(t+dur+0.1); return o; }
function noiseHit(t,vol,type,freq,dur,q=1,dest){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=AC.createGain(); env(g,t,.003,vol,dur); s.connect(f); f.connect(g); g.connect(dest||sfxBus); s.start(t,Math.random()*1.5); s.stop(t+dur+.05); return f; }

/* instruments */
function vBell(m,t,vol,dest,len=1.6){ const g=AC.createGain(); env(g,t,.005,vol,len); g.connect(dest); osc('sine',mf(m),t,len,g);
  const g2=AC.createGain(); env(g2,t,.005,vol*.35,len*.5); g2.connect(dest); osc('sine',mf(m+12),t,len*.5,g2);
  const g3=AC.createGain(); env(g3,t,.002,vol*.12,.25); g3.connect(dest); osc('triangle',mf(m+19),t,.25,g3); }
function vPad(ms,t,dur,vol,dest){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=950; f.Q.value=.5;
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+dur*.35); g.gain.linearRampToValueAtTime(vol*.8,t+dur*.85); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.7);
  f.connect(g); g.connect(dest); ms.forEach(m=>[-7,7].forEach(dt=>{ const o=osc('sawtooth',mf(m),t,dur+.8,f); o.detune.value=dt; })); }
function vBass(m,t,dur,vol,dest){ const g=AC.createGain(); env(g,t,.02,vol,dur); g.connect(dest); osc('sine',mf(m),t,dur,g);
  const g2=AC.createGain(); env(g2,t,.01,vol*.25,dur*.4); g2.connect(dest); osc('triangle',mf(m+12),t,dur*.4,g2); }
function vPluck(m,t,vol,dest){ const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(4200,t); f.frequency.exponentialRampToValueAtTime(600,t+.6);
  const g=AC.createGain(); env(g,t,.003,vol,.9); f.connect(g); g.connect(dest); osc('triangle',mf(m),t,.9,f); }
function vKeys(m,t,vol,dest,len=1.2){ const g=AC.createGain(); env(g,t,.01,vol,len); const tr=AC.createGain(); tr.gain.value=1;
  const l=AC.createOscillator(); l.frequency.value=4.5; const lg=AC.createGain(); lg.gain.value=.22; l.connect(lg); lg.connect(tr.gain); l.start(t); l.stop(t+len+.1);
  g.connect(tr); tr.connect(dest); osc('sine',mf(m),t,len,g); const g2=AC.createGain(); env(g2,t,.002,vol*.25,.12); g2.connect(dest); osc('sine',mf(m)*4.01,t,.12,g2); }
function vFlute(m,t,dur,vol,dest){ const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+.08); g.gain.setValueAtTime(vol,t+Math.max(.09,dur-.1)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+.25);
  g.connect(dest); const o=osc('sine',mf(m),t,dur+.3,g); const v=AC.createOscillator(); v.frequency.value=5.2; const vg=AC.createGain(); vg.gain.value=mf(m)*.006; v.connect(vg); vg.connect(o.frequency); v.start(t+.15); v.stop(t+dur+.3); }
function vHat(t,vol,dest){ noiseHit(t,vol,'highpass',7000,.05,1,dest); }
function vKick(t,vol,dest){ const o=AC.createOscillator(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); const g=AC.createGain(); env(g,t,.003,vol,.22); o.connect(g); g.connect(dest); o.start(t); o.stop(t+.3); }

/* one theme, arranged differently for every room */
const CH={ Am:{b:45,v:[57,60,64],j:[55,57,60,64]}, F:{b:41,v:[57,60,65],j:[53,57,60,64]}, C:{b:48,v:[55,60,64],j:[55,59,60,64]}, G:{b:43,v:[55,59,62],j:[53,55,59,62]}, E:{b:40,v:[56,59,64],j:[56,59,62,64]} };
const PROG=['Am','F','C','G','Am','F','E','Am'];
const THEME=[[76,1.5],[74,.5],[72,1],[71,1],[72,1.5],[69,.5],[69,2],[76,1],[79,1],[77,1],[76,1],[74,3],[71,1],[76,1.5],[74,.5],[72,1],[76,1],[81,2],[77,1],[76,1],[74,1],[72,1],[71,1],[68,1],[69,4]];
const BARS=(()=>{ const bars=[[]]; let acc=0; THEME.forEach(n=>{ if(acc>=4){ bars.push([]); acc=0; } bars[bars.length-1].push(n); acc+=n[1]; }); return bars; })();
const STYLES=['room','garden','shop','room','library','garden','rain','garden','library','rain','shop','balcony'];
const BPM={room:70,garden:76,shop:84,library:58,rain:64,balcony:68,silence:60,metal:84,letter:52};
const ARP=[0,1,2,3,2,1,0,1];
function scheduleBar(style,bar,loop,t,beat,out=musicBus){
  const c=CH[PROG[bar]], alt=loop%2===1;
  const melody=voice=>{ let bt=0; BARS[bar].forEach(([m,len])=>{ voice(m,t+bt*beat,len*beat); bt+=len; }); };
  const tones=[c.v[0],c.v[1],c.v[2],c.v[0]+12];
  if(style==='room'){
    vPad(c.v,t,beat*4,.018,out); vBass(c.b,t,beat*3.5,.07,out);
    if(!alt) melody((m,tt,d)=>vBell(m,tt,.055,out,Math.max(1.2,d*1.5)));
    else { tones.slice(0,3).forEach((m,i)=>vBell(m+12,t+i*beat,.035,out,1.4)); vBell(c.v[1]+12,t+3*beat,.03,out,1.4); }
  } else if(style==='garden'){
    vPad(c.v,t,beat*4,.012,out); vBass(c.b,t,beat*3.5,.06,out);
    ARP.forEach((k,i)=>vPluck(tones[k],t+i*beat/2,.028,out));
    if(!alt) melody((m,tt,d)=>vFlute(m,tt,d*.95,.03,out)); else melody((m,tt)=>vPluck(m+12,tt,.03,out));
  } else if(style==='shop'){
    const sw=k=>k%2?(k-1)*beat/2+beat*.66:k*beat/2;
    c.j.forEach(m=>{ vKeys(m,t,.026,out,1.1); vKeys(m,t+beat*1.66,.018,out,.8); });
    [c.b,c.b+7,c.b+12,c.b+7].forEach((m,i)=>vBass(m,t+i*beat,beat*.9,.06,out));
    vKick(t,.13,out); vKick(t+2*beat,.1,out);
    for(let k=0;k<8;k++) vHat(t+sw(k),k%2?.02:.012,out);
    if(!alt) melody((m,tt,d)=>vKeys(m,tt,.05,out,d*1.2)); else vKeys(c.j[3]+12,t+beat*2.66,.022,out,1);
  } else if(style==='library'){
    vPad(c.v,t,beat*4,.014,out); vBass(c.b,t,beat*3.8,.05,out);
    if(!alt) melody((m,tt)=>vBell(m-12,tt,.05,out,2.2)); else { vBell(c.v[2]+12,t,.03,out,2.5); vBell(c.v[0]+12,t+2*beat,.025,out,2.5); }
  } else if(style==='rain'){
    vPad(c.v,t,beat*4,.02,out); vBass(c.b,t,beat*3.8,.045,out);
    if(!alt) melody((m,tt,d)=>vKeys(m-12,tt,.045,out,d*1.6)); else vBell(c.v[2]+24,t+beat,.02,out,2);
  } else if(style==='metal'){
    for(let k=0;k<8;k++) vChug(c.b+12,t+k*beat/2,beat*.42,.028,out);
    vKick(t,.11,out); vKick(t+beat*2,.11,out); vKick(t+beat*3.5,.08,out); vSnare(t+beat,.06,out); vSnare(t+beat*3,.06,out);
    for(let k=0;k<8;k++) vHat(t+k*beat/2,.013,out);
    if(!alt) melody((m,tt,d)=>vLead(m,tt,d*.95,.03,out));
  } else if(style==='letter'){
    vPad(c.v,t,beat*4,.007,out); melody((m,tt)=>vBell(m-12,tt,.038,out,2.6));
  } else if(style==='balcony'){
    vPad(c.v,t,beat*4,.02,out); vBass(c.b,t,beat*3.8,.06,out);
    ARP.forEach((k,i)=>vPluck(tones[k],t+i*beat/2,.016,out));
    if(!alt) melody((m,tt,d)=>vBell(m,tt,.05,out,Math.max(1.2,d*1.6))); else melody((m,tt,d)=>{ vFlute(m,tt,d*.95,.028,out); vBell(m+12,tt,.018,out,1); });
  }
}
const mus={style:'room',bar:0,loop:0,next:0,pending:null};
function startMusicLoop(){ mus.next=AC.currentTime+.2; setInterval(musicTick,50); }
function musicTick(){
  if(!AC) return;
  if(mus.next<AC.currentTime-1) mus.next=AC.currentTime+.1; // after the tab was in the background
  while(mus.next<AC.currentTime+.35){
    if(mus.pending){ mus.style=mus.pending; mus.pending=null; mus.bar=0; mus.loop=0;
      const g=musicBus.gain; g.cancelScheduledValues(mus.next); g.setValueAtTime(0.0001,mus.next); g.linearRampToValueAtTime(musicOn?MUSIC_VOL:0.0001,mus.next+1.5); }
    const beat=60/BPM[mus.style];
    scheduleBar(mus.style,mus.bar,mus.loop,mus.next,beat);
    mus.next+=beat*4; if(++mus.bar>=8){ mus.bar=0; mus.loop++; }
  }
}
function setMusicStyle(i){
  if(!AC) return; const now=AC.currentTime, g=musicBus.gain;
  g.cancelScheduledValues(now); g.setValueAtTime(Math.max(g.value,0.0001),now); g.linearRampToValueAtTime(0.0001,now+.4);
  mus.pending=typeof i==='string'?i:STYLES[i]; mus.next=now+.5;
}

/* ambience: rain, crickets, vinyl crackle, candles */
const amb={kind:-1};
function startAmbience(){
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  const rf=AC.createBiquadFilter(); rf.type='bandpass'; rf.frequency.value=2600; rf.Q.value=.35;
  amb.rain=AC.createGain(); amb.rain.gain.value=0; src.connect(rf); rf.connect(amb.rain); amb.rain.connect(ambBus);
  const wf=AC.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=380;
  amb.wind=AC.createGain(); amb.wind.gain.value=0; src.connect(wf); wf.connect(amb.wind); amb.wind.connect(ambBus);
  src.start(); setInterval(ambTick,120);
}
function setAmbience(i){ if(!AC) return; const now=AC.currentTime, a=(rooms[i]&&rooms[i].amb)||''; amb.kind=a;
  amb.rain.gain.setTargetAtTime(a==='rain'?.1:0,now,.5); amb.wind.gain.setTargetAtTime(a==='rain'?.06:a==='wind'?.08:a==='crickets'?.04:0,now,.6); }
function ambTick(){
  if(!AC||!amb.kind||amb.kind===-1) return; const t=AC.currentTime+.05, k=amb.kind;
  if(k==='vinyl'&&Math.random()<.55) noiseHit(t+Math.random()*.1,.03+Math.random()*.04,'highpass',2500,.015,1,ambBus);
  if(k==='candle'&&Math.random()<.18) noiseHit(t,.025*Math.random(),'bandpass',1200,.03,2,ambBus);
  if(k==='crickets'&&Math.random()<.22){ const f=4300+Math.random()*500; for(let i=0;i<3;i++){ const g=AC.createGain(); env(g,t+i*.06,.005,.01,.035); g.connect(ambBus); osc('sine',f,t+i*.06,.05,g); } }
  if(k==='rain'&&Math.random()<.1){ const g=AC.createGain(); env(g,t,.002,.03,.12); g.connect(ambBus); const o=osc('sine',900+Math.random()*600,t,.15,g); o.frequency.exponentialRampToValueAtTime(1900,t+.1); }
}

/* sound effects */
const VOICE={ellie:[76,'sine'],george:[60,'triangle'],salem:[84,'sine'],shadow:[53,'triangle'],peaches:[70,'triangle'],bruce:[62,'triangle'],poe:[57,'square']};
const MEOW={george:[.95,.55],salem:[1.55,.32],shadow:[.7,.62],peaches:[1.2,.45],bruce:[.85,.5]};
function meow(id,t){ const [pm,dur]=MEOW[id], base=520*pm;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(base*.8,t); o.frequency.linearRampToValueAtTime(base*1.25,t+dur*.35); o.frequency.exponentialRampToValueAtTime(base*.7,t+dur);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=3; f.frequency.setValueAtTime(700*pm,t); f.frequency.linearRampToValueAtTime(1800*pm,t+dur*.35); f.frequency.linearRampToValueAtTime(900*pm,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.13,t+.05); g.gain.setValueAtTime(.13,t+dur*.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+dur+.05); }
function caw(t){ for(let i=0;i<2;i++){ const tt=t+i*.22; const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(430,tt); o.frequency.exponentialRampToValueAtTime(260,tt+.16);
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1100; f.Q.value=1.5; const g=AC.createGain(); env(g,tt,.01,.1,.17); o.connect(f); f.connect(g); g.connect(sfxBus); o.start(tt); o.stop(tt+.2); noiseHit(tt,.04,'bandpass',1500,.15,2); } }

    case 'blip': { const [m,type]=VOICE[arg]||[72,'sine']; const g=AC.createGain(); env(g,t,.004,type==='square'?.016:.032,.06); g.connect(sfxBus); osc(type,mf(m+[0,2,4,7][Math.floor(Math.random()*4)]),t,.07,g); break; }
    case 'voice': if(arg==='poe') caw(t); else if(arg==='pickle') ribbit(t); else if(MEOW[arg]) meow(arg,t); break;
    case 'mrrp': { if(arg==='poe'){ caw(t); break; } if(arg==='pickle'){ ribbit(t); break; } const [pm]=MEOW[arg]||[1]; const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(380*pm,t); o.frequency.linearRampToValueAtTime(640*pm,t+.12); o.frequency.linearRampToValueAtTime(560*pm,t+.22);
      const l=AC.createOscillator(); l.frequency.value=28; const lg=AC.createGain(); lg.gain.value=30*pm; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+.3);
      const g=AC.createGain(); env(g,t,.02,.08,.24); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+.3); break; }
    case 'next': { const g=AC.createGain(); env(g,t,.002,.02,.04); g.connect(sfxBus); osc('triangle',mf(84),t,.05,g); break; }
    case 'unlock': noiseHit(t,.12,'bandpass',2600,.04,4); noiseHit(t+.09,.1,'bandpass',1800,.05,4); [76,81,88].forEach((n,i)=>vBell(n,t+.18+i*.09,.06,sfxBus,1.1)); break;
    case 'door': { const f=noiseHit(t,.09,'bandpass',300,.6,1.2); f.frequency.exponentialRampToValueAtTime(2400,t+.5); break; }
    case 'pick': [81,85,88].forEach((n,i)=>vBell(n,t+i*.06,.05,sfxBus,.6)); break;
    case 'heart': [76,80,83,88,92].forEach((n,i)=>vBell(n,t+i*.07,.05,sfxBus,.9)); break;
    case 'page': noiseHit(t,.08,'bandpass',3000,.18,.8); noiseHit(t+.13,.06,'bandpass',2200,.22,.8); vPad([57,64,72],t+.1,1.4,.016,sfxBus); break;
    case 'tick': { const g=AC.createGain(); env(g,t,.001,.045,.05); g.connect(sfxBus); osc('sine',1500,t,.06,g); break; }
    case 'ready': vBell(81,t,.06,sfxBus,1.5); vBell(88,t+.12,.045,sfxBus,1.5); break;
    case 'step': { const M={plumwood:['bandpass',700,.05],libwood:['bandpass',620,.05],checkdark:['bandpass',1500,.035],moongrass:['highpass',2600,.022],concrete:['bandpass',1100,.04],stone:['bandpass',950,.045],snow:['highpass',3200,.03],cobble:['bandpass',1200,.04],kitchen:['bandpass',1400,.035],checkwarm:['bandpass',1400,.035]};

      if(room&&room.rain&&Math.random()<.4) noiseHit(t+.02,.02,'highpass',4000,.08); break; }

      const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=arg==='shadow'?220:320;
      const am=AC.createGain(); am.gain.value=0; const lfo=AC.createOscillator(); lfo.frequency.value=arg==='salem'?27:23; const lg=AC.createGain(); lg.gain.value=.6; lfo.connect(lg); lg.connect(am.gain);
      const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.55,t+.15); g.gain.linearRampToValueAtTime(.45,t+1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);

    case 'start': [69,76,81,84,88].forEach((n,i)=>vBell(n,t+i*.08,.05,sfxBus,1.4)); break;
    case 'lanterns': vPad([57,64,69,72,76],t,5,.03,sfxBus); [81,84,88,91,93,96].forEach((n,i)=>vBell(n,t+.5+i*.4,.04,sfxBus,2.2)); break;
    case 'end': [69,72,76,81].forEach((n,i)=>vBell(n+12,t+i*.12,.06,sfxBus,1.6)); break;

}

const C_RING=113.1;
function openNote(i,cb,reread){
  G.noteReturn=G.mode; G.mode='note'; G.noteT=0; G.noteReady=!!reread; G.noteCb=cb; sfx('page');
  if(!reread){ addUnique(STORE.notesRead,i); saveStore(); }
  setMusicStyle('letter');
  $('noteNum').textContent='Letter '+(i+1)+' of '+CONFIG.notes.length;
  const body=$('noteBody'); body.innerHTML='';
  fmt(CONFIG.notes[i]).split(/\n\s*\n/).forEach(par=>{ const p=document.createElement('p'); p.textContent=par; body.appendChild(p); });
  if(i===CONFIG.notes.length-1){ const s=document.createElement('p'); s.className='sig'; s.textContent=fmt(CONFIG.signature); body.appendChild(s); }
  const btn=$('noteBtn');
  if(reread){ btn.disabled=false; btn.textContent='Close'; $('timerNum').textContent='♡'; $('ring').style.strokeDashoffset=C_RING; $('noteHint').textContent=''; setTimeout(()=>btn.focus({preventScroll:true}),50); }
  else { btn.disabled=true; btn.textContent='Keep reading… '+CONFIG.noteSeconds; $('timerNum').textContent=CONFIG.noteSeconds; $('ring').style.strokeDashoffset=0; $('noteHint').textContent=''; }

}
function tickNote(dt){
  if(G.noteReady) return;
  G.noteT+=dt; const secs=CONFIG.noteSeconds, left=Math.max(0,secs-G.noteT);
  $('ring').style.strokeDashoffset=(C_RING*(1-left/secs)).toFixed(2);
  if(left<=0){ G.noteReady=true; const btn=$('noteBtn'); btn.disabled=false; btn.textContent='Continue'; $('timerNum').textContent='♡';
    $('noteHint').textContent=isTouch?'Tap Continue when you\'re ready':'Press Enter when you\'re ready'; btn.focus({preventScroll:true}); sfx('ready'); }
  else { const n=Math.ceil(left); if($('timerNum').textContent!=String(n)){ $('timerNum').textContent=n; sfx('tick'); $('noteBtn').textContent='Keep reading… '+n; } }
}
function closeNote(){
  if(G.mode!=='note') return;
  if(!G.noteReady){ const t=$('timer'); t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge'); return; }
  $('note').classList.remove('open'); restoreMusic(); G.mode=(G.noteReturn&&G.noteReturn!=='note')?G.noteReturn:'play'; if(G.mode==='journal') $('jClose').focus({preventScroll:true}); const cb=G.noteCb; G.noteCb=null; if(cb) cb();

function placeBubble(b){
  const st=$('stage'), s=st.clientWidth/VW, el=b.el, w=el.offsetWidth, h=el.offsetHeight;

/* ---------- particles ---------- */
function burst(x,y,type,n){ for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*40,vy:-10-Math.random()*30,life:0,max:.9+Math.random()*.6,type,col:['#e5718f','#c9a2ff','#ffe0a3','#ffffff'][i%4]}); }
function ambient(dt){
  const r=room;
  if(r.floor==='moongrass'){ if(Math.random()<dt*4) particles.push({x:10+Math.random()*220,y:20+Math.random()*130,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:0,max:3+Math.random()*2,type:'firefly',col:'#e9f5a0'});
    if(G.bloomed&&Math.random()<dt*1.5) particles.push({x:Math.random()*VW,y:-4,vx:8+Math.random()*8,vy:10+Math.random()*6,life:0,max:9,type:'petal',col:'#8a2f52'}); }
  if(r.index===0&&Math.random()<dt*1.5) particles.push({x:Math.random()*VW,y:20+Math.random()*120,vx:(Math.random()-.5)*3,vy:-2,life:0,max:4,type:'dust',col:'#e6d6ff'});
  if(r.floor==='libwood'&&Math.random()<dt*2) particles.push({x:Math.random()*VW,y:20+Math.random()*120,vx:(Math.random()-.5)*3,vy:-2,life:0,max:4,type:'dust',col:'#ffe3a8'});
  if(r.floor==='checkdark'&&Math.random()<dt*1.2) particles.push({x:30+Math.random()*20,y:22,vx:4+Math.random()*4,vy:-5,life:0,max:2.2,type:'note',col:'#c9a2ff'});
  if(r.rain){ for(let k=0;k<Math.ceil(dt*90);k++) particles.push({x:Math.random()*270,y:-6,vx:-25,vy:170+Math.random()*30,life:0,max:.5+Math.random()*.6,type:'rain',col:'#a9b8e0'}); }
  if(r.sky==='moon'){ if(Math.random()<dt*3) particles.push({x:20+Math.random()*200,y:55+Math.random()*95,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:0,max:3+Math.random()*2,type:'firefly',col:'#fff5c0'});
  }
  if((r.sky==='moon'||r.sky==='stars')&&Math.random()<dt*.22){ particles.push({x:20+Math.random()*120,y:2+Math.random()*10,vx:110,vy:30,life:0,max:.9,type:'shoot',col:'#ffffff'});
    if(!G.wishHint&&G.mode==='play'&&!dlg){ G.wishHint=true; setTimeout(()=>toast('A shooting star! '+(isTouch?'Tap ♡':'Press E')+' to make a wish.',3200),200); } }
  const ST=r.task; if(ST&&ST.type==='search'&&ST.started&&!ST.complete&&ST.misses>=2){ const k=Object.keys(ST.hide).find(k=>!ST.searched.has(k));
    if(k&&Math.random()<dt*6){ const [hx,hy]=k.split(',').map(Number); particles.push({x:hx*TS+3+Math.random()*10,y:hy*TS+2+Math.random()*10,vx:0,vy:-6,life:0,max:.8,type:'spark',col:'#e9c46a'}); } }
  r.items.forEach(it=>{ if(!it.taken&&!it.hidden&&it.type==='heart'&&Math.random()<dt*0.7) particles.push({x:it.x*TS+4+Math.random()*8,y:it.y*TS+4+Math.random()*8,vx:0,vy:-4,life:0,max:.7,type:'spark',col:'#ffffff'}); });
}
function updParticles(dt){
  for(const p of particles){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.type==='heart') p.vy+=20*dt;
    if(p.type==='petal') p.vx+=Math.sin(time*2+p.y*.1)*6*dt;
    if(p.type==='lantern') p.x+=Math.sin(time*1.3+p.seed)*4*dt;

function drawParticles(){
  for(const p of particles){
    const a=1-p.life/p.max, x=Math.round(p.x), y=Math.round(p.y);
    ctx.globalAlpha=Math.max(0,Math.min(1,a*1.4));
    if(p.type==='heart'){ R(p.col,x-2,y,2,1);R(p.col,x+1,y,2,1);R(p.col,x-2,y+1,5,1);R(p.col,x-1,y+2,3,1);R(p.col,x,y+3,1,1); }
    else if(p.type==='spark'){ R(p.col,x,y-1,1,3); R(p.col,x-1,y,3,1); }
    else if(p.type==='petal'){ R(p.col,x,y,2,1); }
    else if(p.type==='dust'){ ctx.globalAlpha=.5*Math.sin(Math.PI*p.life/p.max); R(p.col,x,y,1,1); }
    else if(p.type==='note'){ ctx.globalAlpha=.8*Math.sin(Math.PI*p.life/p.max); R(p.col,x,y,2,2); R(p.col,x+1,y-4,1,4); R(p.col,x+2,y-4,1,1); }
    else if(p.type==='rain'){ ctx.globalAlpha=.45; R(p.col,x,y,1,3); }
    else if(p.type==='firefly'){ ctx.globalAlpha=Math.sin(Math.PI*p.life/p.max); R('rgba(255,245,170,.3)',x-1,y-1,3,3); R(p.col,x,y,1,1); }
    else if(p.type==='shoot'){ ctx.globalAlpha=a; for(let k=0;k<8;k++){ ctx.globalAlpha=a*(1-k/8); R(p.col,x-k*2,y-Math.round(k*.55),2,1);} }
    else if(p.type==='zz'){ ctx.globalAlpha=Math.min(1,a*1.5); R(p.col,x,y,3,1); R(p.col,x+1,y+1,1,1); R(p.col,x,y+2,3,1); }
    else if(p.type==='lantern'){ ctx.globalAlpha=Math.min(1,p.life)*(p.y<20?Math.max(0,p.y/20):1);
      glow(x+2,y+3,12,'rgba(255,200,120,.45)'); R('#ffb74d',x,y,5,6); R('#ffe0a3',x+1,y+1,3,3); R('#b0304f',x,y+5,5,1); }
  }
  ctx.globalAlpha=1;
}

const WALLS={ plum:['#3d2b4f','#6f5a8c','#221830'], brickdark:['#5a3a42','#4a2e35','#261a1e'], lib:['#4e3a3a','#3f2e2e','#241818'], parapet:['#7d7a8c','#6b6878','#4d4a5e'], ivy:['#9a94ab','#857f98','#5d5870'] };

    if(room.wall==='plum'){ if(hh(tx,1)<.7) R(W[1],x+Math.floor(hh(tx,2)*14)+1,y+2+Math.floor(hh(tx,3)*8),1,1); if(hh(tx,4)<.4){ const sx=x+Math.floor(hh(tx,5)*12)+2, sy=y+4+Math.floor(hh(tx,6)*5); R(W[1],sx,sy-1,1,3); R(W[1],sx-1,sy,3,1);}

const held=new Set(); let touchDir=null;

addEventListener('keydown',e=>{
  if(!G) return; const onBtn=e.target&&e.target.tagName==='BUTTON';
  if(e.code==='KeyJ'&&!e.repeat){ if(G.mode==='play'&&!dlg){ openJournal(); return; } if(G.mode==='journal'){ closeJournal(); return; } }
  if(e.code==='Escape'){ if(G.mode==='photo') return closePhoto(); if(G.mode==='journal') return closeJournal(); if(G.mode==='note'&&G.noteReady&&G.noteReturn==='journal') return closeNote(); if(G.mode==='mini'&&MINI) return endMini(MINI.won||false,MINI.score); }
  if(KEYMAP[e.code]&&(G.mode==='play'||G.mode==='mini')){ e.preventDefault(); held.add(KEYMAP[e.code]); if(G.mode==='mini'&&!e.repeat&&MINI&&MINI.onDir) MINI.onDir(KEYMAP[e.code]); }
  if(['KeyE','Space','Enter','NumpadEnter','KeyZ'].includes(e.code)){
    if(onBtn&&G.mode!=='play'&&G.mode!=='mini'&&e.code!=='KeyE'&&e.code!=='KeyZ') return; // let focused buttons click
    e.preventDefault(); if(!e.repeat) pressAction(); }
});
addEventListener('keyup',e=>{ if(KEYMAP[e.code]) held.delete(KEYMAP[e.code]); });
addEventListener('blur',()=>{ held.clear(); touchDir=null; });
const pad=$('pad');
function padDir(e){ const r=pad.getBoundingClientRect(); const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  if(Math.hypot(dx,dy)<14) return null; return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'); }
pad.addEventListener('pointerdown',e=>{ e.preventDefault(); pad.setPointerCapture(e.pointerId); touchDir=padDir(e); if(touchDir&&G&&G.mode==='mini'&&MINI&&MINI.onDir) MINI.onDir(touchDir); });
pad.addEventListener('pointermove',e=>{ if(!pad.hasPointerCapture(e.pointerId)) return; const d=padDir(e); if(d!==touchDir){ touchDir=d; if(d&&G&&G.mode==='mini'&&MINI&&MINI.onDir) MINI.onDir(d); } });
['pointerup','pointercancel'].forEach(t=>pad.addEventListener(t,()=>touchDir=null));
$('abtn').addEventListener('pointerdown',e=>{ e.preventDefault(); pressAction(); });

let wantInteract=false;
function pressAction(){
  if(!G) return;
  if(G.mode==='title'){ STORE.run?continueGame():start(); return; }
  if(G.mode==='intro'){ finishIntro(); return; }
  if(G.mode==='credits'){ if(!$('creditsEnd').classList.contains('show')) G.credFast=true; return; }
  if(G.mode==='journal'||G.mode==='photo') return;
  if(G.mode==='map'){ goMapNext(); return; }
  if(G.mode==='post'){ endPost(); return; }
  if(G.mode==='note'){ closeNote(); return; }
  if(G.mode==='end'){ showCredits(); return; }
  if(G.mode==='mini'){ if(MINI&&MINI.onAction) MINI.onAction(); return; }

function hexA(h,a){ const n=parseInt(h.slice(1),16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

  T.flies=CONFIG.fireflies.map((f,i)=>Object.assign({},f,{x:spots[i][0]*TS+8,y:spots[i][1]*TS+6,a:Math.random()*6.28,ph:Math.random()*6,caught:false})); }
function fireflyOk(x,y){ return '.fd'.includes(tileAt(Math.floor(x/TS),Math.floor(y/TS))); }
function updateFireflies(r,dt){ const T=r.task; if(!T.flies||T.complete) return;
  T.flies.forEach(f=>{ if(f.caught) return; f.a+=(Math.random()-.5)*dt*3;
    const nx=f.x+Math.cos(f.a)*9*dt, ny=f.y+Math.sin(f.a)*9*dt;
    if(fireflyOk(nx,ny)){ f.x=nx; f.y=ny; } else f.a+=Math.PI; }); }
function nearFly(r){ const T=r.task; if(T.type!=='fireflies'||!T.started||T.complete||!T.flies) return null;

  T.flies.forEach(f=>{ if(f.caught) return; const d=Math.hypot(f.x-ex,f.y-ey); if(d<bd){ bd=d; best=f; } }); return best; }

    if(T.count>=CONFIG.fireflies.length){ T.complete=true; updateTaskChip(); toast('Bring the fireflies back to '+SPEAKERS.salem.name()); } }));
}

}
function makeNet(fly,onEnd){

/* --- Room 3: rhythm game with Peaches (you play the melody) --- */
const ARROW=["....x....","...xxx...","..xxxxx..",".xxxxxxx.","xxxxxxxxx","...xxx...","...xxx...","...xxx..."];
function rotSprite(c,q){ const o=document.createElement('canvas'); o.width=q%2?c.height:c.width; o.height=q%2?c.width:c.height;
  const g=o.getContext('2d'); g.translate(o.width/2,o.height/2); g.rotate(q*Math.PI/2); g.drawImage(c,-c.width/2,-c.height/2); return o; }
const LANES=['left','down','up','right'], LANE_COL=['#c9a2ff','#5ccf86','#e9c46a','#e5718f'], ROTQ={up:0,right:1,down:2,left:3};
const ARROWS=LANES.map((d,i)=>rotSprite(makeSprite(ARROW,{x:LANE_COL[i]}),ROTQ[d]));
const ARROWS_OFF=LANES.map(d=>rotSprite(makeSprite(ARROW,{x:'#3d3452'},'#6f5a8c'),ROTQ[d]));
function clickAt(T,hi){ if(!AC) return; const g=AC.createGain(); env(g,T,.001,.06,.05); g.connect(miniBus); osc('sine',hi?2000:1400,T,.06,g); }
function makeRhythm(onEnd){
  const beat=60/84, NB=8, SPD=62, HITY=126, LW=25, X0=Math.round((VW-LW*4)/2);
  const notes=[]; let lane=1, prev=null;
  for(let loop=0;loop<1;loop++) for(let bar=0;bar<8;bar++){ const b0=(loop*8+bar)*4; let bt=0;
    BARS[bar].forEach(([m,len])=>{ if(prev!==null){ if(m>prev) lane=Math.min(3,lane+(m-prev>3?2:1)); else if(m<prev) lane=Math.max(0,lane-(prev-m>3?2:1)); else lane=(lane+2)%4; }
      prev=m; notes.push({b:b0+bt,lane,m,hit:0}); bt+=len; });
    [1,3].forEach(q=>{ const b=b0+q; if(!notes.some(n=>Math.abs(n.b-b)<.4)) notes.push({b,lane:(lane+1)%4,m:CH[PROG[bar]].v[2]+12,hit:0}); }); }
  notes.sort((a,c)=>a.b-c.b);
  let t0=0, sched=0, perfect=0, good=0, combo=0, best=0, judge='', judgeT=0, finished=false; const flash=[0,0,0,0];
  const at=n=>t0+n.b*beat;
  const info=()=>{ $('miniInfo').textContent=(judgeT>0?judge+'   ':'')+'Combo '+combo; };
  return { _notes:notes, _at:at, title:'Spin the record', hint:'Arrow keys or WASD on the beat. Esc to leave.', hintTouch:'Press the pad direction as each arrow hits the line',
    init(){ t0=clock()+beat*4+.5; setMusicStyle('silence'); for(let i=0;i<4;i++) clickAt(t0-beat*(4-i),i===3); $('miniMsg').textContent='Get ready…'; info(); },
    cleanup(){ restoreMusic(); },
    onEnd,
    update(dt){ const now=clock();
      while(sched<NB&&t0+sched*4*beat<now+.6){ if(AC) scheduleBar('metal',sched%8,1,t0+sched*4*beat,beat,miniBus); sched++; }
      if(now>=t0-.3&&$('miniMsg').textContent==='Get ready…') $('miniMsg').textContent='';
      notes.forEach(n=>{ if(!n.hit&&now>at(n)+.18){ n.hit=-1; combo=0; judge='Miss'; judgeT=.5; } });
      for(let i=0;i<4;i++) flash[i]=Math.max(0,flash[i]-dt*5); if(judgeT>0) judgeT-=dt; info();
      if(!finished&&now>t0+NB*4*beat+.8){ finished=true; const hits=perfect+good; this.won=true; this.score=hits; const pct=hits/notes.length; if(pct>=.9) earnSticker('perfect');
        sfx('chime');
        $('miniMsg').textContent=(pct>=.9?'Perfect set!':pct>=.7?'Groovy!':pct>=.4?'Nice moves!':'Peaches is nodding along anyway.')+'\n'+hits+' of '+notes.length+' notes · best combo '+best+'\n'+contMsg(); }
    },
    onDir(d){ if(finished) return; const now=clock(), li=LANES.indexOf(d); if(li<0) return; flash[li]=1;
      let pick=null; notes.forEach(n=>{ if(!n.hit&&n.lane===li){ const e=Math.abs(at(n)-now); if(e<.17&&(!pick||e<pick.e)) pick={n,e}; } });
      if(pick){ pick.n.hit=1; combo++; best=Math.max(best,combo); if(pick.e<.08){ perfect++; judge='Perfect!'; } else { good++; judge='Good'; } judgeT=.6;
        if(AC) vLead(pick.n.m,AC.currentTime+.005,.32,.045,miniBus); } },
    onAction(){ if(finished) endMini(this.won,this.score); },
    onTap(){ if(finished) endMini(this.won,this.score); },
    draw(){ dim(.74); const now=clock();
      for(let i=0;i<4;i++) R(i%2?'rgba(255,255,255,.03)':'rgba(255,255,255,.06)',X0+i*LW,0,LW,VH);
      R('rgba(201,162,255,.35)',X0,HITY+5,LW*4,1);
      for(let i=0;i<4;i++){ const s=ARROWS_OFF[i], x=X0+i*LW+Math.round((LW-s.width)/2); ctx.drawImage(s,x,HITY);
        if(flash[i]>0){ ctx.globalAlpha=flash[i]; glow(x+s.width/2,HITY+5,10,'rgba(255,255,255,.5)'); ctx.drawImage(ARROWS[i],x,HITY); ctx.globalAlpha=1; } }
      notes.forEach(n=>{ if(n.hit===1) return; const y=HITY-(at(n)-now)*SPD; if(y<-14||y>VH) return; const s=ARROWS[n.lane];
        ctx.globalAlpha=n.hit===-1?.25:1; ctx.drawImage(s,X0+n.lane*LW+Math.round((LW-s.width)/2),Math.round(y)); ctx.globalAlpha=1; });
      const b=now>t0?Math.floor((now-t0)/beat)%2:0;
      R('#2a1d20',186,112,40,10); R('#15131c',192,108,16,5); R('#c9a2ff',198,109,4,2);
      ctx.drawImage(SPR.peaches,198,94-b); ctx.drawImage(ELLIE['down'+b],18,98-b);
    }
  };
}

/* --- Room 4: impress Shadow (a turn-based "battle") --- */
function makeBattle(onEnd){
  const B=CONFIG.battle, panel=$('miniPanel'), txt=$('panelText'), mv=$('panelMoves');

  function menu(){ state='menu'; txt.textContent=fmt(B.prompt); renderMoves(); }

    let dmg=m.power; const lines=[m.text];
    if(m.risky&&Math.random()<.4){ dmg=6; lines.push(m.failText); }
    else if(last===i){ dmg=Math.round(dmg*.4); lines.push(B.repeat); }
    else lines.push(dmg>=28?B.great:dmg>=20?B.good:B.meh);
    last=i; meter=Math.max(0,meter-dmg); shake=.4; sfx(dmg>=28?'heart':dmg>=20?'pick':'next');
    if(meter<=0) lines.push(...B.win); else lines.push(pick(B.reactions));
    queue=lines; next(); }
  function next(){ if(queue.length){ txt.textContent=fmt(queue.shift()); waitT=1.6; return; }
    if(meter<=0){ state='done'; self.won=true; self.score=turns; txt.textContent=fmt(B.winFinal)+'  '+contMsg(); sfx('chime'); }
    else menu(); }
  const self={ title:'Impress Shadow', hint:'Arrow keys to choose. Enter to confirm. Esc to leave.', hintTouch:'Tap a move',

    cleanup(){ panel.classList.add('hidden'); mv.innerHTML=''; }, onEnd,
    update(dt){ t+=dt; shown+=(meter-shown)*Math.min(1,dt*4); info(); if(shake>0) shake-=dt;
      if(state==='text'){ waitT-=dt; if(waitT<=0) next(); } },
    onDir(d){ if(state!=='menu') return; const c=sel%2, r=Math.floor(sel/2);

    onAction(){ if(state==='menu') use(sel); else if(state==='text') next(); else if(state==='done') endMini(true,turns); },
    onTap(){ if(state==='text') next(); else if(state==='done') endMini(true,turns); },
    draw(){ dim(.74); const sx=shake>0?Math.round(Math.sin(t*60)*2):0, bob=Math.floor(t*1.5)%2, s=SPR.shadow;
      glow(160,54,32,'rgba(201,162,255,.16)'); R('rgba(10,6,16,.35)',138,78,46,5);

/* --- Observatory: Poe's constellations --- */
function makeStars(onEnd){
  const CS=CONFIG.constellations; let ci=0, pts, seq, next, cur, lines, t=0, doneT=0, finished=false;
  function load(){ const c=CS[ci]; pts=c.pts; seq=c.seq; next=1; cur=seq[0]; lines=[]; $('miniInfo').textContent=(ci+1)+' / '+CS.length; }
  function jump(d){ const [dx,dy]=DV[d], [cx,cy]=pts[cur]; let best=-1, bs=1e9;
    pts.forEach(([x,y],i)=>{ if(i===cur) return; const vx=x-cx, vy=y-cy, dist=Math.hypot(vx,vy), dot=(vx*dx+vy*dy)/dist; if(dot<.35) return; const sc=dist*(2-dot); if(sc<bs){ bs=sc; best=i; } });
    if(best>=0){ cur=best; sfx('next'); } }
  function pick(i){ if(finished||doneT>0) return; cur=i;
    if(i===seq[next]){ lines.push([seq[next-1],i]); if(AC) vBell(69+next*2,AC.currentTime+.01,.06,miniBus,1.2); next++;
      if(next>=seq.length){ doneT=1.8; sfx('chime'); $('miniMsg').textContent=CS[ci].name; } }
    else { sfx('bump'); self.fails=(self.fails||0)+1; } }
  const self={ _dbg:()=>({seq,next,pts,cur,doneT}), title:"Poe's constellations", msgTop:'16%', hint:'Arrow keys to move between stars. Enter to connect. Esc to leave.', hintTouch:'Tap the glowing star next',
    init(){ load(); }, onEnd,
    update(dt){ t+=dt; if(doneT>0){ doneT-=dt; if(doneT<=0){ ci++; $('miniMsg').textContent=''; if(ci>=CS.length){ finished=true; self.won=true; $('miniMsg').textContent='The sky is back in order.\n'+contMsg(); } else load(); } } },
    onDir(d){ if(!finished&&doneT<=0) jump(d); },
    onAction(){ if(finished) return endMini(true); pick(cur); },
    onTap(x,y){ if(finished) return endMini(true); let best=-1, bd=16; pts.forEach(([px,py],i)=>{ const d=Math.hypot(px-x,py-y); if(d<bd){ bd=d; best=i; } }); if(best>=0) pick(best); },
    draw(){ dim(.82);
      for(let i=0;i<60;i++){ const sx=Math.floor(hh(i,11)*VW), sy=Math.floor(hh(i,12)*VH); R(Math.sin(t*2+i)>.5?'#6f6488':'#3d3452',sx,sy,1,1); }
      if(finished) return;
      ctx.strokeStyle=doneT>0?'rgba(255,230,160,.95)':'rgba(201,162,255,.85)'; ctx.lineWidth=1;
      lines.forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(pts[a][0]+.5,pts[a][1]+.5); ctx.lineTo(pts[b][0]+.5,pts[b][1]+.5); ctx.stroke(); });
      pts.forEach(([x,y],i)=>{ const isNext=doneT<=0&&i===seq[next]; glow(x,y,isNext?10:5,isNext?'rgba(255,240,160,.65)':'rgba(255,255,255,.35)'); R(isNext?'#ffe066':'#efe6f5',x-1,y-1,2,2); });
      if(!isTouch&&doneT<=0){ const [x,y]=pts[cur]; ctx.strokeStyle='#e9c46a'; ctx.strokeRect(x-4.5,y-4.5,9,9); }
      ctx.drawImage(SPR.poe,206,118); }
  };
  return self;
}
